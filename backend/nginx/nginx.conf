worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # В логе видно, какая реплика api обработала запрос (upstream=...).
    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time upstream=$upstream_addr rid=$request_id';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    sendfile          on;
    keepalive_timeout 65;

    # Лимит MAX_UPLOAD_MB в api = 10 МБ; здесь с запасом на multipart-обёртку.
    client_max_body_size 12m;

    gzip on;
    gzip_types application/json application/problem+json text/css application/javascript;

    # Ограничение частоты: вход и регистрация — защита от перебора паролей.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=20r/s;
    limit_req_status 429;

    # DNS Docker: имя сервиса api резолвится во все реплики.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream api_backend {
        zone api_backend 64k;
        # resolve: nginx перечитывает DNS и подхватывает новые реплики после
        # `docker compose up --scale api=N` без перезапуска.
        server api:8000 resolve;
        keepalive 32;
    }

    server {
        listen 80;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Строгий лимит только на вход и регистрацию; /auth/me и /auth/refresh — как обычный API.
        location = /api/v1/auth/login {
            limit_req zone=auth burst=5 nodelay;
            include /etc/nginx/proxy_params.conf;
        }

        location = /api/v1/auth/register {
            limit_req zone=auth burst=5 nodelay;
            include /etc/nginx/proxy_params.conf;
        }

        location / {
            limit_req zone=api burst=40 nodelay;
            include /etc/nginx/proxy_params.conf;
        }
    }
}
