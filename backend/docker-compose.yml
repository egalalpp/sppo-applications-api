# Запуск всего стека одной командой:  docker compose up -d --build
# Перед первым запуском: скопируйте .env.example в .env (см. README.md).

name: sppo

# Общие переменные окружения для api, worker, init и flower.
x-app-env: &app-env
  ENVIRONMENT: ${ENVIRONMENT:-dev}
  MONGO_HOST: mongo
  MONGO_DB: ${MONGO_DB:-sppo}
  MONGO_REPLICA_SET: rs0  # replica set из одного узла (сервис mongo ниже): нужен для транзакций
  MONGO_APP_USER: ${MONGO_APP_USER:?MONGO_APP_USER is not set, copy .env.example to .env}
  MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is not set}
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is not set}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set}
  HASH_PEPPER: ${HASH_PEPPER:?HASH_PEPPER is not set, copy .env.example to .env}
  # Хранилище: по умолчанию локальный SeaweedFS из этого compose. Чтобы использовать облако
  # (Cloudflare R2 и др.), задайте S3_ENDPOINT_URL, ключи, S3_REGION и S3_PUBLIC_ENDPOINT_URL в .env.
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://s3:8333}
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:8333}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is not set}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is not set}
  S3_BUCKET: ${S3_BUCKET:-sppo-docs}
  CURRENT_PERIOD: ${CURRENT_PERIOD:-2026-autumn}
  MAX_QUEUE_LENGTH: ${MAX_QUEUE_LENGTH:-50000}
  CORS_ORIGINS: ${CORS_ORIGINS:-[]}
  CELERY_BROKER: ${CELERY_BROKER:-}
  FRONTEND_URL: ${FRONTEND_URL:-}
  SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
  # Распознавание (Tesseract)
  OCR_ENABLED: ${OCR_ENABLED:-true}
  OCR_LANG: ${OCR_LANG:-rus+eng}
  OCR_MAX_SIDE_PX: ${OCR_MAX_SIDE_PX:-2000}
  OCR_TIMEOUT_SEC: ${OCR_TIMEOUT_SEC:-180}
  OCR_STALE_MINUTES: ${OCR_STALE_MINUTES:-15}
  # Подметальщик: ставит в очередь заявки, которые не попали туда при отправке
  SWEEPER_ENABLED: ${SWEEPER_ENABLED:-true}
  SWEEP_INTERVAL_SEC: ${SWEEP_INTERVAL_SEC:-30}
  # Почта: по умолчанию письма уходят в Mailpit из этого compose (http://localhost:8025)
  EMAIL_BACKEND: ${EMAIL_BACKEND:-}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-}
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  MAIL_FROM: ${MAIL_FROM:-СППО РУТ (МИИТ) <noreply@sppo.local>}

# Один образ на четыре сервиса: отличаются только командой.
x-app: &app
  build:
    context: ./api
    target: runtime
  image: sppo-api:local
  restart: unless-stopped
  environment: *app-env

services:
  # ---------- Данные ----------
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    # Replica set из одного узла нужен для транзакций: статус заявки и запись в журнал аудита меняются
    # атомарно. entrypoint.sh создаёт keyFile (его требует авторизация вместе с replica set) и запускает
    # штатную точку входа; healthcheck.sh один раз выполняет rs.initiate, вручную ничего делать не нужно.
    entrypoint: ["/bin/sh", "/mongo-entrypoint.sh"]
    command: ["mongod", "--replSet", "rs0", "--keyFile", "/tmp/mongo-keyfile", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER is not set}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is not set}
      # Для init-скрипта, который создаёт пользователя приложения
      MONGO_DB: ${MONGO_DB:-sppo}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
      - ./mongo/entrypoint.sh:/mongo-entrypoint.sh:ro
      - ./mongo/healthcheck.sh:/mongo-healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "sh", "/mongo-healthcheck.sh"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
    # Порт наружу не публикуется: к базе ходят только сервисы внутри сети compose.

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # noeviction: в этом же Redis лежит очередь Celery — вытеснять её нельзя.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory-policy noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # S3-совместимое хранилище сканов (SeaweedFS в режиме «всё в одном процессе»).
  s3:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    command:
      - mini
      - -s3.port=8333
      - -s3.encryptVolumeData=true  # файлы на диске хранятся зашифрованными
      - -webdav=false
      - -admin.ui=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    environment:
      # Ключи из env становятся единственной admin-учёткой S3; анонимный доступ выключен.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports:
      # Только localhost: браузеру нужен S3 для скачивания по presigned-ссылкам.
      - "127.0.0.1:8333:8333"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Почтовая «песочница» для разработки: принимает все письма и показывает их в веб-интерфейсе,
  # наружу ничего не отправляет. Для настоящей рассылки задайте SMTP_* или BREVO_API_KEY в .env.
  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - "127.0.0.1:8025:8025"  # веб-интерфейс; SMTP (1025) доступен только внутри сети compose
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------- Приложение ----------
  init:
    <<: *app
    restart: "no"
    command: ["python", "-m", "app.bootstrap"]
    environment:
      <<: *app-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy

  api:
    <<: *app
    deploy:
      replicas: ${API_REPLICAS:-2}
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  worker:
    <<: *app
    # Распознавание заявок (очередь applications) и отправка писем (очередь mail).
    # CELERY_CONCURRENCY — число параллельных обработчиков (c в модели M/M/c/K).
    environment:
      <<: *app-env
      RUN_MODE: worker
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-4}
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  flower:
    <<: *app
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "flower", "--port=5555"]
    environment:
      <<: *app-env
      FLOWER_BASIC_AUTH: ${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?FLOWER_PASSWORD is not set}
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      redis:
        condition: service_healthy

  # ---------- Вход ----------
  nginx:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mongo-data:
  redis-data:
  s3-data:
