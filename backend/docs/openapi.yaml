components:
  schemas:
    AppStatus:
      type: string
      enum:
      - draft
      - pending
      - in_review
      - approved
      - rejected
      title: AppStatus
    ApplicationCreate:
      properties:
        basis:
          type: string
          title: Basis
          examples:
          - orphan
        period:
          anyOf:
          - type: string
            pattern: ^\d{4}-(spring|autumn)$
          - type: 'null'
          title: Period
          description: По умолчанию — текущий период из настроек
          examples:
          - 2026-autumn
        student:
          $ref: '#/components/schemas/StudentIn'
        payout:
          $ref: '#/components/schemas/PayoutIn'
        form:
          $ref: '#/components/schemas/FormIn'
          default:
            applicant_signed: false
            consent_pd_signed: false
      additionalProperties: false
      type: object
      required:
      - basis
      - student
      - payout
      title: ApplicationCreate
    ApplicationOut:
      properties:
        id:
          type: string
          title: Id
        applicant_user_id:
          type: string
          title: Applicant User Id
        schema_version:
          type: integer
          title: Schema Version
        period:
          type: string
          title: Period
        basis:
          type: string
          title: Basis
        student:
          $ref: '#/components/schemas/StudentIn'
        payout:
          $ref: '#/components/schemas/PayoutIn'
        form:
          $ref: '#/components/schemas/FormIn'
        attachments:
          items:
            $ref: '#/components/schemas/AttachmentOut'
          type: array
          title: Attachments
        status:
          $ref: '#/components/schemas/AppStatus'
        rejection_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Rejection Reason
          description: Причина отказа (при статусе rejected)
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        checks:
          anyOf:
          - items:
              $ref: '#/components/schemas/CheckOut'
            type: array
          - type: 'null'
          title: Checks
        ocr:
          anyOf:
          - $ref: '#/components/schemas/OcrOut'
          - type: 'null'
      type: object
      required:
      - id
      - applicant_user_id
      - schema_version
      - period
      - basis
      - student
      - payout
      - form
      - attachments
      - status
      - created_at
      - updated_at
      title: ApplicationOut
    ApplicationSummary:
      properties:
        id:
          type: string
          title: Id
        basis:
          type: string
          title: Basis
        period:
          type: string
          title: Period
        status:
          $ref: '#/components/schemas/AppStatus'
        rejection_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Rejection Reason
        student_full_name:
          type: string
          title: Student Full Name
        institute:
          type: string
          title: Institute
        group:
          type: string
          title: Group
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        ocr_state:
          anyOf:
          - $ref: '#/components/schemas/OcrState'
          - type: 'null'
        ocr_accuracy:
          anyOf:
          - type: integer
          - type: 'null'
          title: Ocr Accuracy
      type: object
      required:
      - id
      - basis
      - period
      - status
      - student_full_name
      - institute
      - group
      - created_at
      - updated_at
      title: ApplicationSummary
    ApplicationUpdate:
