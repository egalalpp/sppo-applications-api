openapi: 3.1.0
info:
  title: SPPO Applications API
  description: '

    Прототип REST API для приёма и проверки заявок студентов на материальную поддержку
    (СППО РУТ (МИИТ)).


    **Авторизация:** получите токен через `POST /api/v1/auth/login` (студент — после

    `POST /api/v1/auth/register`, администратор — из `.env`) и передавайте его в заголовке

    `Authorization: Bearer <token>`.


    Роли: `student` — свои заявки; `operator` — очередь, проверка и решение; `admin`
    — всё плюс пользователи и справочник.

    Распознавание сканов (OCR) и проверки видят только оператор и администратор.

    Ошибки возвращаются в формате `application/problem+json` (RFC 9457).

    '
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - system
      summary: 'Liveness: процесс жив'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /ready:
    get:
      tags:
      - system
      summary: 'Readiness: доступны MongoDB, Redis и S3'
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/tasks/{task_id}:
    get:
      tags:
      - tasks
      summary: Состояние фоновой задачи Celery (оператор и админ)
      operationId: task_state_api_v1_tasks__task_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: Регистрация студента
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Unprocessable Content
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: 'Вход: email в поле username, пароль в password (OAuth2 form)'
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_login_api_v1_auth_login_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Обновить пару токенов по refresh-токену
      operationId: refresh_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Текущий пользователь
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/benefit-types:
    get:
      tags:
      - benefit-types
      summary: Список оснований и обязательных документов
      operationId: list_benefit_types_api_v1_benefit_types_get
      parameters:
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Inactive
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BenefitTypeOut'
                title: Response List Benefit Types Api V1 Benefit Types Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/benefit-types/{code}:
    get:
      tags:
      - benefit-types
      summary: Одно основание
      operationId: get_benefit_type_api_v1_benefit_types__code__get
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          title: Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitTypeOut'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/applications:
    post:
      tags:
      - applications
      summary: Создать заявку (черновик)
      operationId: create_application_api_v1_applications_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          description: Повтор запроса с тем же ключом вернёт ту же заявку
          title: Idempotency-Key
        description: Повтор запроса с тем же ключом вернёт ту же заявку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOut'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Unprocessable Content
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      tags:
      - applications
      summary: Список заявок
      description: Студент видит только свои заявки; оператор и админ — все, с фильтрами.
      operationId: list_applications_api_v1_applications_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AppStatus'
          - type: 'null'
          title: Status
      - name: basis
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Basis
      - name: period
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Period
      - name: applicant_user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Только для оператора и админа
          title: Applicant User Id
        description: Только для оператора и админа
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ApplicationSummary_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/applications/{app_id}:
    get:
      tags:
      - applications
      summary: Заявка целиком
      operationId: get_application_api_v1_applications__app_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
          title: App Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOut'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - applications
      summary: Изменить черновик
      operationId: update_application_api_v1_applications__app_id__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
          title: App Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOut'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Unprocessable Content
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags:
      - applications
      summary: Удалить черновик
      operationId: delete_application_api_v1_applications__app_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
          title: App Id
      responses:
        '204':
          description: Successful Response
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/applications/{app_id}/submit:
    post:
      tags:
      - applications
      summary: Отправить заявку на рассмотрение
      description: 'Доступно, когда заполнена форма, есть согласие на обработку ПДн
        и приложены все документы из списка для выбранного основания (в интерфейсе
        в этот момент разблокируется кнопка). Ответ 202: заявка принята, о результате
        студент узнает по статусу и из письма.'
      operationId: submit_application_api_v1_applications__app_id__submit_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
          title: App Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitOut'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Unprocessable Content
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Service Unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/applications/{app_id}/status:
    get:
      tags:
      - applications
      summary: Статус заявки (кэшируется в Redis на несколько секунд)
      operationId: get_status_api_v1_applications__app_id__status_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
          title: App Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOut'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/applications/{app_id}/history:
    get:
      tags:
      - applications
      summary: История смены статусов
      operationId: get_history_api_v1_applications__app_id__history_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
          title: App Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryItem'
                title: Response Get History Api V1 Applications  App Id  History Get
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/applications/{app_id}/checks:
    get:
      tags:
      - applications
      summary: Результаты автоматических и ручных проверок (оператор и админ)
      operationId: get_checks_api_v1_applications__app_id__checks_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
          title: App Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CheckOut'
                title: Response Get Checks Api V1 Applications  App Id  Checks Get
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/applications/{app_id}/attachments:
    post:
      tags:
      - attachments
      summary: Загрузить скан документа (PDF, JPEG или PNG)
      operationId: upload_attachment_api_v1_applications__app_id__attachments_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
          title: App Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_attachment_api_v1_applications__app_id__attachments_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentOut'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Payload Too Large
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Unprocessable Content
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      tags:
      - attachments
      summary: Список вложений (оператору — вместе с результатом распознавания)
      operationId: list_attachments_api_v1_applications__app_id__attachments_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
          title: App Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttachmentOut'
                title: Response List Attachments Api V1 Applications  App Id  Attachments
                  Get
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/applications/{app_id}/attachments/{attachment_id}/download-url:
    get:
      tags:
      - attachments
      summary: Временная ссылка на скачивание скана (presigned URL)
      operationId: download_url_api_v1_applications__app_id__attachments__attachment_id__download_url_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
          title: App Id
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
          title: Attachment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadUrlOut'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/applications/{app_id}/attachments/{attachment_id}:
    delete:
      tags:
      - attachments
      summary: Удалить вложение
      operationId: delete_attachment_api_v1_applications__app_id__attachments__attachment_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
          title: App Id
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
          title: Attachment Id
      responses:
        '204':
          description: Successful Response
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/operator/queue:
    get:
      tags:
      - operator
      summary: 'Очередь оператора (FIFO: сначала старые заявки)'
      description: 'В каждой заявке — ocr_state (ready_for_review, ocr_failed, ...)
        и ocr_accuracy, %. Заявки с ocr_failed тоже открываются: распознавание можно
        перезапустить.'
      operationId: operator_queue_api_v1_operator_queue_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          enum:
          - pending
          - in_review
          type: string
          default: pending
          title: Status
      - name: ocr_state
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/OcrState'
          - type: 'null'
          title: Ocr State
      - name: basis
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Basis
      - name: period
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Period
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ApplicationSummary_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/applications/{app_id}/transitions:
    post:
      tags:
      - operator
      summary: Сменить статус заявки (оператор / админ)
      description: 'pending -> in_review (взять в работу), in_review -> approved |
        rejected | pending. При to=rejected обязательно rejection_reason: его увидит
        студент. О переходе в approved и rejected студенту уходит письмо.'
      operationId: transition_api_v1_applications__app_id__transitions_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
          title: App Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOut'
        '404':
          description: Not Found
          content:
            application/problem+json:
